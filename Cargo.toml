[workspace]
members = ["programs/*", "packages/kadex-math", "packages/kadex-risk", "packages/kadex-interface"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[workspace.dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
kadex-math = { path = "packages/kadex-math" }
kadex-risk = { path = "packages/kadex-risk" }
kadex-interface = { path = "packages/kadex-interface" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
