[package]
name = "kadex-interface"
version = "0.1.0"
description = "Interfaces CONGELADAS entre os programas do Kadex. Mudar aqui quebra outro time."
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib"]
name = "kadex_interface"

[dependencies]
anchor-lang = { workspace = true }
kadex-math = { workspace = true }
kadex-risk = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
