[package]
name = "kadex-risk"
version = "0.1.0"
description = "Kadex risk rules. Pure functions, no Anchor, no Solana — so a rule cannot touch an account."
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib"]
name = "kadex_risk"

# Deliberately empty of anchor-lang and solana-program. If you find yourself
# wanting to add either, the code you are writing belongs in a program, not here.
[dependencies]
kadex-math = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
